<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>心灯AI</title>
  <style>
    body{
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,
      "Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
      max-width:820px;margin:26px auto;padding:0 14px;line-height:1.7
    }
    h1{font-size:24px;margin:0 0 14px}
    .box{border:1px solid #ddd;border-radius:14px;padding:14px}
    .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}
    input,textarea{
      width:100%;box-sizing:border-box;border:1px solid #ccc;
      border-radius:12px;padding:10px;font-size:16px
    }
    textarea{min-height:120px;resize:vertical}
    button{
      border:0;border-radius:12px;padding:10px 14px;
      font-size:16px;cursor:pointer;background:#111;color:#fff
    }
    button.secondary{background:#eee;color:#111}
    button:disabled{opacity:.5;cursor:not-allowed}
    .muted{color:#666;font-size:13px}
    .pill{
      display:inline-flex;align-items:center;gap:8px;
      border:1px solid #ddd;border-radius:999px;
      padding:6px 10px;font-size:13px
    }
    .ok{color:#0a7}
    .ng{color:#d33}
    pre{
      white-space:pre-wrap;word-break:break-word;
      background:#fafafa;border:1px solid #eee;
      border-radius:12px;padding:12px;margin-top:12px
    }
    .grid{display:grid;grid-template-columns:1fr;gap:12px}
    @media(min-width:760px){.grid{grid-template-columns:1fr 1fr}}
  </style>
</head>
<body>

<h1>心灯AI</h1>

<div class="box">

  <div class="muted">
    まずはログイン（メール）→ ログイン後、相談を送れます。
  </div>

  <div class="grid" style="margin-top:10px">
    <div>
      <div class="muted">メールアドレス</div>
      <input id="email" type="email" placeholder="example@gmail.com" />

      <div class="row">
        <button id="btnSendLink">ログインリンクを送る</button>
        <button id="btnLogout" class="secondary" disabled>ログアウト</button>
        <span id="authState" class="pill ng">未ログイン</span>
      </div>

      <div class="muted" style="margin-top:6px">
        ※届いたメールのリンクを開くと、このページに戻ってログイン完了します。
      </div>
    </div>

    <div>
      <div class="muted">アカウント</div>

      <div class="pill" style="width:100%;justify-content:space-between">
        <span>UID</span>
        <span id="uid" class="muted">-</span>
      </div>

      <div class="pill" style="width:100%;justify-content:space-between;margin-top:8px">
        <span>残り回数</span>
        <span id="tickets" class="muted">-</span>
      </div>
    </div>
  </div>

  <hr style="border:none;border-top:1px solid #eee;margin:14px 0">

  <div class="muted">
    相談や質問を書いて「送信」を押してください。
  </div>

  <textarea id="text" placeholder="例：好きな人がいるけど、気持ちが伝わらない"></textarea>

  <div class="row">
    <button id="send" disabled>送信</button>
    <button id="buy" class="secondary" style="display:none;">
      10回分を購入する（¥500）
    </button>
    <span id="state" class="muted"></span>
  </div>

  <div id="ticketMsg" class="muted" style="margin-top:8px;"></div>

  <pre id="out">（ここに返答が出ます）</pre>
</div>

<!-- Supabase JS -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
/* ===============================
   🔧 あなたのSupabase情報（入替不要）
================================ */
const SUPABASE_URL = "https://jaxfvwzvhvbenrcrgduy.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_1MOnC3nmYzLMuswWc6qgvw_AaEjxE6W";
const FUNCTION_URL =
  "https://jaxfvwzvhvbenrcrgduy.supabase.co/functions/v1/kokorobi-ai";

// GitHub Pagesの index.html に戻す（ここ超重要）
const EMAIL_REDIRECT_TO = "https://toybox917-cell.github.io/kokorobi-ai/index.html";
/* =============================== */

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = (id) => document.getElementById(id);

let currentTickets = 0;

/* ---------- UI制御 ---------- */
function setAuthUI(user){
  if(user){
    $("authState").textContent = "ログイン中";
    $("authState").classList.remove("ng");
    $("authState").classList.add("ok");
    $("btnLogout").disabled = false;
    $("uid").textContent = user.id;

    // 残数が読み込めるまで一旦送信は止める（ここがコツ）
    $("send").disabled = true;
  }else{
    $("authState").textContent = "未ログイン";
    $("authState").classList.remove("ok");
    $("authState").classList.add("ng");
    $("btnLogout").disabled = true;
    $("send").disabled = true;
    $("buy").style.display = "none";
    $("ticketMsg").textContent = "";
    $("uid").textContent = "-";
    $("tickets").textContent = "-";
    currentTickets = 0;
  }
}

function applyTicketGate(){
  // 未ログイン中は何もしない
  if($("uid").textContent === "-") return;

  if(currentTickets <= 0){
    $("send").disabled = true;
    $("buy").style.display = "inline-block";
    $("ticketMsg").textContent = "残り回数が0です。続けるには購入してください。";
  }else{
    $("send").disabled = false;
    $("buy").style.display = "none";
    $("ticketMsg").textContent = "";
  }
}

/* ---------- 認証 ---------- */
async function refreshSession(){
  const { data } = await sb.auth.getSession();
  const user = data?.session?.user || null;
  setAuthUI(user);
  if(user) await loadTickets();
}

$("btnSendLink").onclick = async () => {
  const email = $("email").value.trim();
  if(!email){ alert("メールを入力してください"); return; }

  $("btnSendLink").disabled = true;
  $("authState").textContent = "送信中…";
  $("authState").classList.remove("ng");
  $("authState").classList.add("ok");

  try{
    const { error } = await sb.auth.signInWithOtp({
      email,
      options:{ emailRedirectTo: EMAIL_REDIRECT_TO }
    });
    if(error) throw error;

    $("authState").textContent = "メールを確認してください";
  }catch(e){
    console.error(e);
    $("authState").textContent = "送信失敗";
    $("authState").classList.remove("ok");
    $("authState").classList.add("ng");
    alert("送信に失敗しました。SupabaseのEmail設定/URL設定を確認してください。");
  }finally{
    $("btnSendLink").disabled = false;
  }
};

$("btnLogout").onclick = async () => {
  await sb.auth.signOut();
  setAuthUI(null);
  $("out").textContent = "（ここに返答が出ます）";
};

/* ---------- チケット取得（profiles.ticket_count） ---------- */
async function loadTickets(){
  const { data:{ user } } = await sb.auth.getUser();
  if(!user) return;

  const { data, error } = await sb
    .from("profiles")
    .select("ticket_count")
    .eq("user_id", user.id)
    .maybeSingle();

  if(error){
    console.error(error);
    $("tickets").textContent = "取得エラー";
    $("ticketMsg").textContent = "チケット取得でエラー。RLS（select own）の設定を確認してください。";
    $("send").disabled = true;
    $("buy").style.display = "inline-block";
    return;
  }

  currentTickets = data?.ticket_count ?? 0;
  $("tickets").textContent = currentTickets;
  applyTicketGate();
}

/* ---------- 送信 ---------- */
$("send").onclick = async () => {
  const text = $("text").value.trim();
  if(!text) return;

  // 残り0なら、ここでも二重で止める（フロントの保険）
  if(currentTickets <= 0){
    applyTicketGate();
    return;
  }

  $("state").textContent = "送信中…";
  $("send").disabled = true;

  try{
    const { data:{ session } } = await sb.auth.getSession();
    if(!session){
      alert("ログインしてください");
      setAuthUI(null);
      return;
    }

    const res = await fetch(FUNCTION_URL,{
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "Authorization":"Bearer " + session.access_token
      },
      body:JSON.stringify({ text })
    });

    const json = await res.json();
    if(!res.ok){
      throw new Error(json?.error || "通信エラー");
    }

    $("out").textContent = json.reply || "返答がありません";

    // ここは「表示更新」だけ（消費処理をEdge側に入れたら自動で減る）
    await loadTickets();

  }catch(e){
    console.error(e);
    $("out").textContent = "通信エラーが発生しました";
  }finally{
    $("state").textContent = "";
    // loadTickets() の結果でON/OFFされるけど念のため
    applyTicketGate();
  }
};

/* ---------- 購入（仮：後でStripe Checkoutに差し替え） ---------- */
$("buy").onclick = () => {
  // TODO: Stripe Checkout URL に置き換える
  window.open("https://note.com/", "_blank");
};

/* ---------- 初期化 ---------- */
sb.auth.onAuthStateChange(() => refreshSession());
refreshSession();
</script>

</body>
</html>
